<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>① Video</title>

<style>
:root {
  --bg: #0f1115;
  --card-bg: #1a1d24;
  --text: #ffffff;
  --text-muted: #8b92a5;
  --accent: #ff2a5f;
}
* { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: var(--bg);
  color: var(--text);
}
.container {
  background: var(--card-bg);
  padding: 24px;
  border-radius: 16px;
  text-align: center;
  max-width: 380px;
  width: 90%;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.05);
}
.thumbnail {
  width: 100%;
  height: 200px;
  background: #2a2e38;
  border-radius: 12px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  cursor: pointer;
}
.thumbnail::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%);
}
.play-btn {
  width: 64px;
  height: 64px;
  background: rgba(255, 42, 95, 0.9);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  box-shadow: 0 4px 15px rgba(255, 42, 95, 0.4);
  transition: transform 0.2s ease;
}
.thumbnail:hover .play-btn {
  transform: scale(1.1);
}
.play-btn svg {
  width: 28px;
  height: 28px;
  fill: #fff;
  margin-left: 4px;
}
.badge {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  z-index: 2;
  letter-spacing: 0.5px;
}
.duration {
  position: absolute;
  bottom: 12px;
  right: 12px;
  background: rgba(0,0,0,0.8);
  padding: 3px 6px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  z-index: 2;
}
.title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 8px;
  line-height: 1.4;
  color: #e4e6eb;
}
.stats {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.stats span {
  display: flex;
  align-items: center;
  gap: 4px;
}
.action-btn {
  display: block;
  background: var(--accent);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  font-size: 16px;
  padding: 16px 24px;
  border-radius: 12px;
  transition: all 0.2s;
  width: 100%;
}
.action-btn:hover {
  background: #e01e4d;
}
</style>
</head>
<body>

<div class="container">
  <a id="dynamic-link" href="https://aaronmwalephotography.github.io/?id=" style="text-decoration: none;">
    <div class="thumbnail">
      <div class="badge">TRENDING</div>
      <div class="play-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="duration">Watch Full</div>
    </div>
  </a>
  
  <div class="title">Tap below to continue watching.</div>
  
  <div class="stats">
    <span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      1.2M Views
    </span>
    <span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      Viral
    </span>
  </div>
</div>

<script type="text/javascript">
  (function() {
    const url = window.location;
    let id = '';

    // Parameter standard URLSearchParams (?id=kqvCk45l1)
    const urlParams = new URLSearchParams(url.search);
    if (urlParams.has('id')) {
      id = urlParams.get('id');
    } 
    // Parameter tanpa key (?kqvCk45l1)
    else if (url.search && !url.search.includes('=')) {
      id = url.search.substring(1);
    } 
    // Berdasarkan Pathname (/kqvCk45l1)
    else {
      const path = url.pathname.replace(/^\/|\/$/g, '');
      if (path && path !== 'index.html' && path !== 'playback.html') {
        id = path;
      }
    }

    // Jika ID ditemukan, ganti href pada link target
    if (id) {
      const dynamicLink = document.getElementById('dynamic-link');
      if (dynamicLink) {
        dynamicLink.href = "https://aaronmwalephotography.github.io/?id=" + id;
      }
    }
  })();
</script>

</body>
</html>
